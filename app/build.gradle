plugins {
    id "com.android.application"
}

android {
    namespace "io.github.syldegil.helivoice"
    compileSdk 36

    defaultConfig {
        applicationId "io.github.syldegil.helivoice"
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "0.1.0-public-preview"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        // API 37 is a preview on this SDK; Android 16 / API 36 is the phone target.
        disable "OldTargetApi"
    }
}
